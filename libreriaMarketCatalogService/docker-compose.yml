version: '3.8'
services:
  lmcatalogms:
    build: .
    container_name: lmcatalogms
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_APPLICATION_NAME=LMCatalogMS
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8090/eureka
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_DATASOURCE_URL=jdbc:mariadb://host.docker.internal:3306/catalog_db
      - SPRING_DATASOURCE_USERNAME=cataloguser
      - SPRING_DATASOURCE_PASSWORD=catalog1234
    networks:
      - libmark-network

networks:
  libmark-network:
    external: true